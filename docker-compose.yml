version: '3.8'

services:
  db:
    image: postgres:13.8
    container_name: jira_postgres

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "${DB_PORT}:5432" # external:internal

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  jira-connector:
    build:
      context: ./jira-connector
      dockerfile: Dockerfile
    container_name: jira_connector_service
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_HOST=db
    ports:
      - "8080:8080"

volumes:
  postgres_data: